function switchAuth(type){

if(type === "login"){

document.getElementById("loginBox")
.classList.remove("hidden");

document.getElementById("registerBox")
.classList.add("hidden");

}else{

document.getElementById("loginBox")
.classList.add("hidden");

document.getElementById("registerBox")
.classList.remove("hidden");

}

}

window.switchAuth = switchAuth;

async function uploadImage(file,path){

const storageRef = ref(storage,path);

await uploadBytes(storageRef,file);

return await getDownloadURL(storageRef);

}

async function register(){

const username =
document.getElementById("registerUsername").value.trim();

const email =
document.getElementById("registerEmail").value.trim();

const password =
document.getElementById("registerPassword").value.trim();

const avatarFile =
document.getElementById("registerAvatar").files[0];

if(!username || !email || !password){

alert("Completa todos los campos");
return;

}

try{

const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);

let avatarUrl =
"https://i.pravatar.cc/300";

if(avatarFile){

avatarUrl =
await uploadImage(
avatarFile,
"avatars/" + Date.now()
);

}

await updateProfile(userCredential.user,{

displayName: username,
photoURL: avatarUrl

});

await setDoc(
doc(db,"users",userCredential.user.uid),
{

username,
email,
avatar:avatarUrl,
bio:"Nuevo en Rankiu",
followers:0,
createdAt:Date.now()

}
);

alert("Cuenta creada");

}catch(error){

alert(error.message);

}

}

async function login(){

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value.trim();

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(error){

alert(error.message);

}

}

async function logout(){

await signOut(auth);

}

document.getElementById("registerBtn")
.addEventListener("click",register);

document.getElementById("loginBtn")
.addEventListener("click",login);

async function createPost(){

if(!currentUser){

alert("Inicia sesión");
return;

}

const title =
document.getElementById("postTitle").value.trim();

const content =
document.getElementById("postContent").value.trim();

const imageFile =
document.getElementById("postImage").files[0];

if(!title || !content){

alert("Completa todos los campos");
return;

}

let imageUrl = "";

if(imageFile){

imageUrl =
await uploadImage(
imageFile,
"posts/" + Date.now()
);

}

await addDoc(collection(db,"posts"),{

title,
content,
image:imageUrl,
author:currentUser.displayName,
authorId:currentUser.uid,
authorAvatar:currentUser.photoURL,
likes:0,
createdAt:serverTimestamp()

});

document.getElementById("postTitle").value = "";
document.getElementById("postContent").value = "";

}

document.getElementById("publishBtn")
.addEventListener("click",createPost);

// 1. FUNCIÓN RENDERIZAR POSTS (Solo dibuja el HTML, no asigna funciones onclick repetitivas)
function renderPosts(posts){
const container = document.getElementById("postsContainer");
container.innerHTML = "";
posts.forEach(post => {
const div = document.createElement("div");
div.id = `post-card-${post.id}`;
div.className = `bg-zinc-950 border border-zinc-800 rounded-3xl p-5 transition-all duration-300`;
div.innerHTML = `
<div class="flex gap-4 items-center">
<img src="${post.authorAvatar || 'https://i.pravatar.cc/150'}" class="w-14 h-14 rounded-full object-cover">
<div>
<div class="font-bold text-lg">${post.author}</div>
</div>
</div>
<h2 class="text-2xl font-bold mt-5">${post.title}</h2>
<p class="text-zinc-300 mt-3 whitespace-pre-wrap">${post.content}</p>
${post.image? `<img src="${post.image}" class="mt-5 rounded-2xl w-full max-h-[500px] object-cover">`: ''}

<div class="mt-5 flex gap-4 items-center border-b border-zinc-900 pb-4">
  <div class="flex items-center bg-zinc-900 rounded-xl p-1 border border-zinc-800 gap-2">
    <button class="px-3 py-2 upvoteBtn text-zinc-500 hover:text-green-500 transition text-xl" data-id="${post.id}">▲</button>
    <span id="up-counter-${post.id}" class="font-bold text-green-500">0</span>
    <span class="text-zinc-600">|</span>
    <span id="down-counter-${post.id}" class="font-bold text-red-500">0</span>
    <button class="px-3 py-2 downvoteBtn text-zinc-500 hover:text-red-500 transition text-xl" data-id="${post.id}">▼</button>
  </div>
  
  <button class="bg-zinc-900 px-5 py-3 rounded-xl followBtn" data-id="${post.authorId}">➕ Seguir</button>
</div>

<div class="mt-4">
  <h3 class="text-sm font-semibold text-zinc-400 mb-2">Comentarios</h3>
  <div id="comments-list-${post.id}" class="space-y-2 mb-3 max-h-40 overflow-y-auto scrollbar text-sm"></div>
  
  <div class="flex gap-2">
    <input id="comment-input-${post.id}" placeholder="Escribe un comentario..." class="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-zinc-700"/>
    <button class="bg-green-500 hover:bg-green-400 text-black font-bold px-4 py-2 rounded-xl text-sm commentBtn" data-id="${post.id}">Enviar</button>
  </div>
</div>
`;
container.appendChild(div);

// Escucha en tiempo real de comentarios simplificada (Elimina el error de falta de índice en Firebase)
const commentsQuery = query(collection(db, "comments"), where("postId", "==", post.id));
onSnapshot(commentsQuery, (commentSnapshot) => {
    const commentListContainer = document.getElementById(`comments-list-${post.id}`);
    if (commentListContainer) {
        commentListContainer.innerHTML = "";
        // Ordenamos localmente en JavaScript para evitar que Firebase bloquee la consulta
        const sortedDocs = commentSnapshot.docs.map(d => d.data()).sort((a,b) => a.createdAt - b.createdAt);
        
        sortedDocs.forEach(comment => {
            const commentDiv = document.createElement("div");
            commentDiv.className = "bg-zinc-900/50 p-3 rounded-xl border border-zinc-900";
            commentDiv.innerHTML = `<strong>${comment.author}:</strong> <span class="text-zinc-300">${comment.text}</span>`;
            commentListContainer.appendChild(commentDiv);
        });
    }
});
});
}

// 2. ESCUCHADOR DE CLICS GLOBAL (Delegación de Eventos - Resuelve el conteo de 2 en 2 por completo)
document.addEventListener("click", async (event) => {
    const target = event.target;

    // Manejar Click en botón de comentario
    if (target.classList.contains("commentBtn")) {
        if(!currentUser) return alert("Inicia sesión para comentar");
        const postId = target.dataset.id;
        const input = document.getElementById(`comment-input-${postId}`);
        const text = input.value.trim();
        if(!text) return;

        await addDoc(collection(db, "comments"), {
            postId,
            text,
            author: currentUser.displayName,
            authorId: currentUser.uid,
            createdAt: Date.now()
        });
        input.value = "";
    }

    // Manejar Click en Upvote
    if (target.classList.contains("upvoteBtn")) {
        if(!currentUser) return alert("Inicia sesión para votar");
        const voteId = `${currentUser.uid}_${target.dataset.id}`;
        await setDoc(doc(db, "votes", voteId), {
            postId: target.dataset.id,
            userId: currentUser.uid,
            type: "up",
            createdAt: Date.now()
        });
    }

    // Manejar Click en Downvote
    if (target.classList.contains("downvoteBtn")) {
        if(!currentUser) return alert("Inicia sesión para votar");
        const voteId = `${currentUser.uid}_${target.dataset.id}`;
        await setDoc(doc(db, "votes", voteId), {
            postId: target.dataset.id,
            userId: currentUser.uid,
            type: "down",
            createdAt: Date.now()
        });
    }

    // Manejar Click en Seguir
    if (target.classList.contains("followBtn")) {
        if(!currentUser) return alert("Inicia sesión para seguir");
        await addDoc(collection(db, "followers"), {
            followerId: currentUser.uid, followingId: target.dataset.id
        });
        alert("Ahora sigues a este usuario");
    }
});

function renderUsers(){

document.getElementById("usersList");

async function sendMessage(){

if(!selectedUser){

alert("Selecciona usuario");
return;

}

const input =
document.getElementById("messageInput");

const text =
input.value.trim();

if(!text) return;

await addDoc(collection(db,"messages"),{

from:currentUser.uid,
to:selectedUser.id,
text,
createdAt:serverTimestamp()

});

input.value = "";

}

document.getElementById("sendBtn")
.addEventListener("click",sendMessage);

function listenMessages(){

if(!selectedUser) return;

document.getElementById("chatHeader")
.innerText =
selectedUser.username;

const q =
query(
collection(db,"messages"),
orderBy("createdAt","asc")
);

onSnapshot(q,(snapshot)=>{

const messages =
snapshot.docs
.map(doc => ({
id:doc.id,
...doc.data()
}))
.filter(msg =>

(
msg.from === currentUser.uid &&
msg.to === selectedUser.id
)

||

(
msg.to === currentUser.uid &&
msg.from === selectedUser.id
)

);

const container =
document.getElementById("chatMessages");

container.innerHTML = "";

messages.forEach(msg => {

const mine =
msg.from === currentUser.uid;

const div =
document.createElement("div");

div.className =
`flex ${mine ? 'justify-end' : 'justify-start'}`;

div.innerHTML = `

<div class="
max-w-[70%]
px-4 py-3 rounded-2xl
${mine
? 'bg-green-500 text-black'
: 'bg-zinc-800'}
">

${msg.text}

</div>

`;

container.appendChild(div);

});

});

}

}

if(section === "profile"){

document.getElementById("profileSection")

}

if(section === "chat"){

}

}

.src =

async function updateProfilePhoto(){

if(!currentUser) return;

const file =
document.getElementById("newProfilePhoto").files[0];

if(!file){

alert("Selecciona una imagen");
return;

}

try{

const imageUrl =
await uploadImage(
file,
"profilePhotos/" + currentUser.uid + "_" + Date.now()
);

await updateProfile(currentUser,{
photoURL:imageUrl
});

await setDoc(
doc(db,"users",currentUser.uid),
{
avatar:imageUrl
},
{ merge:true }
);

document.getElementById("profileAvatar")
.src = imageUrl;

updateNavbar();

alert("Foto de perfil actualizada");

}catch(error){

alert(error.message);

}

}

document.getElementById("updatePhotoBtn")
.addEventListener("click",updateProfilePhoto);

// ESCUCHADOR GLOBAL DE VOTOS (Muestra positivos, negativos y cambia el color del marco)
onSnapshot(collection(db, "votes"), (snapshot) => {
    // Almacenaremos contadores independientes por cada post
    const postVotes = {};

    snapshot.docs.forEach(doc => {
        const vote = doc.data();
        if (!postVotes[vote.postId]) {
            postVotes[vote.postId] = { up: 0, down: 0 };
        }
        
        if (vote.type === "up") postVotes[vote.postId].up += 1;
        if (vote.type === "down") postVotes[vote.postId].down += 1;
    });

    // Actualizar los elementos HTML en base a los conteos individuales
    Object.keys(postVotes).forEach(postId => {
        const upCounter = document.getElementById(`up-counter-${postId}`);
        const downCounter = document.getElementById(`down-counter-${postId}`);
        const postCard = document.getElementById(`post-card-${postId}`);
        
        const ups = postVotes[postId].up;
        const downs = postVotes[postId].down;

        // Mostrar totales individuales en la interfaz
        if (upCounter) upCounter.innerText = ups;
        if (downCounter) downCounter.innerText = downs;

        // Enmarcar la publicación comparando cuál voto es mayor
        if (postCard) {
            postCard.classList.remove("border-green-500", "border-red-500", "border-zinc-800");

            if (ups > downs) {
                postCard.classList.add("border-green-500"); // Más positivos que negativos
            } else if (downs > ups) {
                postCard.classList.add("border-red-500");   // Más negativos que positivos
            } else {
                postCard.classList.add("border-zinc-800");   // Empate o sin votos
            }
        }
    });
});

    // Actualizar los elementos HTML en base a los conteos individuales
    Object.keys(postVotes).forEach(postId => {
        const upCounter = document.getElementById(`up-counter-${postId}`);
        const downCounter = document.getElementById(`down-counter-${postId}`);
        const postCard = document.getElementById(`post-card-${postId}`);
        
        const ups = postVotes[postId].up;
        const downs = postVotes[postId].down;

        // Mostrar totales individuales en la interfaz
        if (upCounter) upCounter.innerText = ups;
        if (downCounter) downCounter.innerText = downs;

        // Enmarcar la publicación comparando cuál voto es mayor
        if (postCard) {
            postCard.classList.remove("border-green-500", "border-red-500", "border-zinc-800");

            if (ups > downs) {
                postCard.classList.add("border-green-500"); // Más positivos que negativos
            } else if (downs > ups) {
                postCard.classList.add("border-red-500");   // Más negativos que positivos
            } else {
                postCard.classList.add("border-zinc-800");   // Empate o sin votos
            }
        }
    });
;

onAuthStateChanged(auth,async(user)=>{

currentUser = user;

updateNavbar();

if(user){

document.getElementById("authModal")
.classList.add("hidden");

renderProfile();

await loadUsers();

}else{

document.getElementById("authModal")
.classList.remove("hidden");

}

});


</script>

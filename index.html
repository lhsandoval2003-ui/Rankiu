<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rankiu Firebase</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body{
      background:#050505;
    }

    .scrollbar::-webkit-scrollbar{
      width:6px;
    }

    .scrollbar::-webkit-scrollbar-thumb{
      background:#222;
      border-radius:20px;
    }
  </style>
</head>

<body class="text-white min-h-screen">

<nav class="border-b border-zinc-800 bg-black/80 backdrop-blur sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

    <div class="text-3xl font-bold text-green-400">
      rankiu
    </div>

    <div class="flex gap-3 items-center">
      <button onclick="showSection('feed')" class="bg-zinc-900 px-4 py-2 rounded-xl hover:bg-zinc-800">
        Feed
      </button>

      <button onclick="showSection('profile')" class="bg-zinc-900 px-4 py-2 rounded-xl hover:bg-zinc-800">
        Perfil
      </button>

      <div id="navUser" class="flex items-center gap-3"></div>
    </div>

  </div>
</nav>

<div class="max-w-7xl mx-auto px-4 py-6">

  <section id="feedSection">

    <div class="bg-zinc-950 border border-zinc-800 rounded-3xl p-5 mb-6">

      <h2 class="text-2xl font-bold mb-4">
        Crear publicación
      </h2>

      <input
        id="postTitle"
        placeholder="Título"
        class="w-full mb-3 bg-zinc-900 border border-zinc-700 rounded-xl p-4"/>

      <textarea
        id="postContent"
        placeholder="¿Qué quieres compartir?"
        class="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-4 h-32 resize-none"></textarea>

      <button
        id="publishBtn"
        class="mt-4 bg-green-500 hover:bg-green-400 text-black font-bold px-6 py-3 rounded-xl">
        Publicar
      </button>

    </div>

    <div id="postsContainer" class="space-y-5"></div>

  </section>

  <section id="profileSection" class="hidden">

    <div class="bg-zinc-950 border border-zinc-800 rounded-3xl p-8 max-w-xl mx-auto text-center">

      <img
        id="profileAvatar"
        class="w-32 h-32 rounded-full mx-auto object-cover border-4 border-green-500 mb-5">

      <h2
        id="profileUsername"
        class="text-3xl font-bold mb-3">
      </h2>

      <div class="bg-zinc-900 rounded-2xl p-5 mt-4">

        <div class="text-zinc-400 text-sm">
          EMAIL
        </div>

        <div
          id="profileEmail"
          class="text-xl font-bold mt-2 text-green-400">
        </div>

      </div>

    </div>

  </section>

</div>

<div
  id="authModal"
  class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">

  <div class="bg-zinc-950 border border-zinc-800 rounded-3xl p-8 w-full max-w-md">

    <div class="flex gap-3 mb-6">

      <button
        onclick="switchAuth('login')"
        class="flex-1 bg-zinc-900 rounded-xl py-3">
        Login
      </button>

      <button
        onclick="switchAuth('register')"
        class="flex-1 bg-zinc-900 rounded-xl py-3">
        Registro
      </button>

    </div>

    <div id="loginBox">

      <input
        id="loginEmail"
        placeholder="Email"
        class="w-full mb-3 bg-zinc-900 border border-zinc-700 rounded-xl p-4"/>

      <input
        type="password"
        id="loginPassword"
        placeholder="Contraseña"
        class="w-full mb-3 bg-zinc-900 border border-zinc-700 rounded-xl p-4"/>

      <button
        id="loginBtn"
        class="w-full bg-green-500 hover:bg-green-400 text-black font-bold py-4 rounded-xl">
        Iniciar sesión
      </button>

    </div>

    <div id="registerBox" class="hidden">

      <input
        id="registerUsername"
        placeholder="Usuario"
        class="w-full mb-3 bg-zinc-900 border border-zinc-700 rounded-xl p-4"/>

      <input
        id="registerEmail"
        placeholder="Email"
        class="w-full mb-3 bg-zinc-900 border border-zinc-700 rounded-xl p-4"/>

      <input
        type="password"
        id="registerPassword"
        placeholder="Contraseña"
        class="w-full mb-3 bg-zinc-900 border border-zinc-700 rounded-xl p-4"/>

      <button
        id="registerBtn"
        class="w-full bg-green-500 hover:bg-green-400 text-black font-bold py-4 rounded-xl">
        Crear cuenta
      </button>

    </div>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut,
  updateProfile
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBX-Ynms8abEJESVUDGk75bzrPyrbrFnxg",
  authDomain: "rankiu-5da90.firebaseapp.com",
  projectId: "rankiu-5da90",
  storageBucket: "rankiu-5da90.firebasestorage.app",
  messagingSenderId: "365366406441",
  appId: "1:365366406441:web:4e4a068b57d93d21061b38"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let posts = [];

function switchAuth(type){

  if(type === "login"){

    document.getElementById("loginBox")
      .classList.remove("hidden");

    document.getElementById("registerBox")
      .classList.add("hidden");

  }else{

    document.getElementById("loginBox")
      .classList.add("hidden");

    document.getElementById("registerBox")
      .classList.remove("hidden");

  }

}

window.switchAuth = switchAuth;

async function register(){

  const username =
    document.getElementById("registerUsername").value.trim();

  const email =
    document.getElementById("registerEmail").value.trim();

  const password =
    document.getElementById("registerPassword").value.trim();

  if(!username || !email || !password){
    alert("Completa todos los campos");
    return;
  }

  try{

    const userCredential =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    await updateProfile(userCredential.user,{
      displayName: username
    });

    alert("Cuenta creada correctamente");

  }catch(error){

    alert(error.message);

  }

}

async function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value.trim();

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    alert(error.message);

  }

}

async function logout(){

  await signOut(auth);

}

document.getElementById("registerBtn")
  .addEventListener("click", register);

document.getElementById("loginBtn")
  .addEventListener("click", login);

function updateNavbar(){

  const nav =
    document.getElementById("navUser");

  if(currentUser){

    nav.innerHTML = `
      <div class="font-bold">
        ${currentUser.displayName || 'Usuario'}
      </div>

      <button
        id="logoutBtn"
        class="bg-red-500 px-4 py-2 rounded-xl text-black font-bold">
        Salir
      </button>
    `;

    setTimeout(()=>{

      document
        .getElementById("logoutBtn")
        .addEventListener("click", logout);

    },100);

  }else{

    nav.innerHTML = `
      <div class="text-zinc-400">
        Invitado
      </div>
    `;

  }

}

async function createPost(){

  if(!currentUser){

    alert("Debes iniciar sesión");
    return;

  }

  const title =
    document.getElementById("postTitle")
      .value.trim();

  const content =
    document.getElementById("postContent")
      .value.trim();

  if(!title || !content){

    alert("Completa todos los campos");
    return;

  }

  try{

    await addDoc(collection(db,"posts"),{

      title,
      content,

      author:
        currentUser.displayName || "Usuario",

      authorId:
        currentUser.uid,

      createdAt:
        serverTimestamp()

    });

    document.getElementById("postTitle").value = "";
    document.getElementById("postContent").value = "";

  }catch(error){

    alert(error.message);

  }

}

document
  .getElementById("publishBtn")
  .addEventListener("click", createPost);

function renderPosts(){

  const container =
    document.getElementById("postsContainer");

  container.innerHTML = "";

  posts.forEach(post => {

    const div =
      document.createElement("div");

    div.className = `
      bg-zinc-950
      border
      border-zinc-800
      rounded-3xl
      p-5
    `;

    div.innerHTML = `

      <div class="font-bold text-green-400 text-lg">
        ${post.author}
      </div>

      <div class="text-zinc-500 text-sm mt-1">
        ${post.createdAt
          ? new Date(post.createdAt.seconds * 1000)
            .toLocaleString()
          : "Ahora"}
      </div>

      <h2 class="text-2xl font-bold mt-4">
        ${post.title}
      </h2>

      <p class="text-zinc-300 mt-3 whitespace-pre-wrap">
        ${post.content}
      </p>

    `;

    container.appendChild(div);

  });

}

function renderProfile(){

  if(!currentUser) return;

  document.getElementById("profileUsername")
    .innerText =
      currentUser.displayName || "Usuario";

  document.getElementById("profileEmail")
    .innerText =
      currentUser.email;

  document.getElementById("profileAvatar")
    .src =
      "https://i.pravatar.cc/300";

}

function showSection(section){

  document
    .getElementById("feedSection")
    .classList.add("hidden");

  document
    .getElementById("profileSection")
    .classList.add("hidden");

  if(section === "feed"){

    document
      .getElementById("feedSection")
      .classList.remove("hidden");

  }

  if(section === "profile"){

    document
      .getElementById("profileSection")
      .classList.remove("hidden");

  }

}

window.showSection = showSection;

const q =
  query(
    collection(db,"posts"),
    orderBy("createdAt","desc")
  );

onSnapshot(q,(snapshot)=>{

  posts =
    snapshot.docs.map(doc => ({
      id: doc.id,
      ...doc.data()
    }));

  renderPosts();

});

onAuthStateChanged(auth,(user)=>{

  currentUser = user;

  updateNavbar();

  renderProfile();

  if(user){

    document.getElementById("authModal")
      .classList.add("hidden");

  }else{

    document.getElementById("authModal")
      .classList.remove("hidden");

  }

});

</script>

</body>
</html>
